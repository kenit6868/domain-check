[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "domaincheck-backend"
version = "0.1.0"
description = "Multi-user API and workers for Domain Check Tool"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.20.0",
  "asyncpg==0.32.0",
  "cryptography==50.0.2",
  "fastapi==0.143.1",
  "pillow==12.3.0",
  "playwright==1.62.0",
  "pydantic-settings==2.16.0",
  "python-multipart==0.0.32",
  "pyjwt[crypto]==2.15.1",
  "PySocks==1.7.1",
  "redis==7.3.0",
  "requests==2.34.2",
  "python-whois==0.9.6",
  "dnspython==2.9.0",
  "tldextract==5.3.0",
  "ipwhois==1.3.0",
  "sqlalchemy[asyncio]==2.1.4",
  "tzdata==2026.3",
  "uvicorn[standard]==0.41.0",
]

[project.scripts]
domaincheck-admin = "domaincheck.cli:main"
domaincheck-cloudflare-runner = "domaincheck.cloudflare_runner:main"

domaincheck-worker = "domaincheck.workers.cli:main"

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/domaincheck"]
dev-mode-dirs = ["src", "compat"]

# Explicit compatibility modules, without config.ini or runtime data.
[tool.hatch.build.targets.wheel.force-include]
"compat/phishing_toolkit.py" = "phishing_toolkit.py"
"compat/cloaking_detector.py" = "cloaking_detector.py"
"compat/browser_evidence.py" = "browser_evidence.py"
"compat/quick_report_actions.py" = "quick_report_actions.py"
"compat/provider_replies.py" = "provider_replies.py"
"compat/cloudflare_dashboard_session.py" = "cloudflare_dashboard_session.py"
"compat/cloudflare_abuse_api.py" = "cloudflare_abuse_api.py"

[tool.pytest.ini_options]
testpaths = ["tests"]


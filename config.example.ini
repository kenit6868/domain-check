; Đổi tên file này thành config.ini và điền thông tin trước khi chạy phishing_toolkit.py

[api]
; Lấy free tại https://www.virustotal.com/gui/my-apikey (cần tài khoản VirusTotal)
vt_api_key = YOUR_VIRUSTOTAL_API_KEY

; Lấy tại Google Cloud Console > bật "Safe Browsing API" > tạo API key
; Không bắt buộc — nếu để trống, tool chỉ bỏ qua bước check Safe Browsing
gsb_api_key = YOUR_GOOGLE_SAFE_BROWSING_API_KEY

; Lấy free tại https://urlscan.io/ > Sign up > Settings > API Keys
; Cần thiết để submit scan lấy screenshot trang phishing làm bằng chứng
; Free tier: 5000 scans/ngày
urlscan_api_key = YOUR_URLSCAN_API_KEY

[company]
; Thông tin dùng để điền sẵn vào email báo cáo abuse
brand_name = my brand
contact_name = Neik
contact_email = neik@camellrp.com

[cloaking]
; Điểm quan sát mạng tùy chọn để kiểm tra site thay đổi theo IP/quốc gia/ASN.
; Mỗi điểm chạy desktop trực tiếp + Android từ Google qua proxy riêng.
; `browser:true` cho phép Playwright chạy thêm qua proxy đó (chậm hơn nhiều).
; Proxy có credential chỉ được đặt trong config.ini thật, không commit.
vantage_points =
; Ví dụ:
; vantage_points = [{"name":"vn-mobile","country":"VN","proxy":"socks5://user:password@proxy.example:1080","browser":true}]

[smtp]
; === Cấu hình mới: nhiều tài khoản + proxy xoay vòng ===
;
; `accounts` là JSON array, mỗi phần tử là 1 tài khoản SMTP:
;
; Gmail (STARTTLS, port 587):
;   {"host":"smtp.gmail.com","port":587,"username":"user@gmail.com","password":"app_password"}
;   Mặc định chữ ký email dùng `username`. Có thể thêm `contact_name` và `contact_email`
;   vào từng account nếu muốn chữ ký khác địa chỉ đăng nhập SMTP.
;   → Dùng "App Password" 16 ký tự tại myaccount.google.com/apppasswords (KHÔNG dùng mật khẩu thường)
;
; Mail server SSL/TLS (port 465) — vd. mail.camellrp.com:
;   {"host":"mail.camellrp.com","port":465,"username":"user@camellrp.com","password":"matkhau","ssl":true,"imap_host":"mail.camellrp.com","imap_port":993}
;   → Thêm "ssl":true để dùng SMTP_SSL thay vì STARTTLS
;   → Thêm "imap_host"/"imap_port" để tự động lưu vào thư mục Sent sau khi gửi
;   → Nếu bỏ qua imap_host, email vẫn gửi được nhưng sẽ không xuất hiện trong Sent
;
; Khi ấn "Gửi đồng loạt", TẤT CẢ tài khoản sẽ gửi ĐỒNG THỜI (mỗi account 1 proxy xoay vòng).
; Khi chọn "Gửi từ tài khoản này", chỉ gửi từ account đó (không đồng loạt).
;
accounts = [{"host":"mail.example.com","port":465,"username":"user@example.com","password":"CHANGE_ME","ssl":true,"imap_host":"mail.example.com","imap_port":993}]

; Ví dụ đầy đủ (điền vào config.ini, KHÔNG điền ở đây):
; accounts = [{"host":"smtp.gmail.com","port":587,"username":"sender@gmail.com","password":"xxxx xxxx xxxx xxxx"},{"host":"mail.camellrp.com","port":465,"username":"ban@camellrp.com","password":"matkhau","ssl":true,"imap_host":"mail.camellrp.com","imap_port":993}]

; `proxies` là JSON array chuỗi proxy — hỗ trợ socks5://, socks4://, http://, hoặc host:port
; (mặc định SOCKS5). Xoay vòng: account 0 → proxy 0, account 1 → proxy 1, account 2 → proxy 0, ...
; Để trống nếu không dùng proxy.
; Yêu cầu: pip install PySocks (đã có trong requirements.txt)
proxies =
; Ví dụ:
; proxies = ["socks5://127.0.0.1:1080","socks5://user:pass@proxy2.example.com:1081"]

; === Backward compat: cấu hình đơn (1 tài khoản, không proxy) ===
; Nếu `accounts` ở trên để trống, tool sẽ dùng 3 trường này để tạo 1 tài khoản duy nhất.
; Không bắt buộc — nếu cả accounts lẫn host/username/password đều trống, tính năng gửi email
; chỉ bị disable, không lỗi.
host = smtp.gmail.com
port = 587
username =
password =
